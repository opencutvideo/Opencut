<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenCut — Free Open Source Video Editor</title>
  <meta name="description" content="OpenCut is a free, open-source video editor for web, desktop, and mobile. No watermarks, no subscriptions." />
  <meta name="robots" content="noindex" />
  <meta property="og:title" content="OpenCut — Free Open Source Video Editor" />
  <meta property="og:image" content="https://opencutvideo.github.io/Opencut/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="/Opencut/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/Opencut/apple-touch-icon.png" />
  <meta name="theme-color" content="#111111" />
  <script>
    var l = window.location;
    var segmentCount = 1;
    var path = l.pathname.slice(1).split('/').slice(segmentCount).join('/');
    if (path) {
      sessionStorage.redirect = '/' + path + (l.search || '') + (l.hash || '');
    }
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=1'
    );
  </script>
</head>
<body>Redirecting…</body>
</html>
