<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#111111"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="white" stroke-width="0.4" stroke-opacity="0.06"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="white" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark -->
  <g transform="translate(80, 70)">
    <rect width="56" height="56" rx="12" fill="white"/>
    <path d="M18 20L38 28L18 36V20Z" fill="#111111"/>
  </g>

  <!-- OpenCut wordmark -->
  <text x="152" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="white" letter-spacing="-0.5">OpenCut</text>

  <!-- Badge -->
  <rect x="152" y="126" width="82" height="22" rx="11" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <text x="193" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.5" text-anchor="middle" letter-spacing="0.5">open source</text>

  <!-- Main headline -->
  <text x="80" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-2">Free Video Editor.</text>
  <text x="80" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="white" fill-opacity="0.3" letter-spacing="-2">For everyone.</text>

  <!-- Description -->
  <text x="80" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="white" fill-opacity="0.5" letter-spacing="-0.2">Web · Desktop · Mobile — no watermarks, no subscriptions, no uploads.</text>

  <!-- Feature pills -->
  <g transform="translate(80, 480)">
    <!-- pill 1 -->
    <rect width="130" height="36" rx="18" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
    <text x="65" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.7" text-anchor="middle">Rust / WASM</text>
    <!-- pill 2 -->
    <rect x="146" width="148" height="36" rx="18" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
    <text x="220" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.7" text-anchor="middle">Privacy-first</text>
    <!-- pill 3 -->
    <rect x="310" width="130" height="36" rx="18" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
    <text x="375" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.7" text-anchor="middle">MIT License</text>
    <!-- pill 4 -->
    <rect x="456" width="182" height="36" rx="18" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
    <text x="547" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.7" text-anchor="middle">CapCut Alternative</text>
  </g>

  <!-- Right: mock editor UI -->
  <g transform="translate(760, 80)">
    <!-- editor card -->
    <rect width="360" height="470" rx="14" fill="white" fill-opacity="0.03" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <!-- titlebar -->
    <rect width="360" height="38" rx="14" fill="white" fill-opacity="0.04"/>
    <rect width="360" height="14" y="24" fill="white" fill-opacity="0.04"/>
    <circle cx="20" cy="19" r="5" fill="#FF5F57" fill-opacity="0.8"/>
    <circle cx="38" cy="19" r="5" fill="#FFBD2E" fill-opacity="0.8"/>
    <circle cx="56" cy="19" r="5" fill="#28C840" fill-opacity="0.8"/>
    <text x="180" y="23" font-family="monospace" font-size="10" fill="white" fill-opacity="0.3" text-anchor="middle">OpenCut — untitled project</text>

    <!-- preview area -->
    <rect x="10" y="48" width="240" height="160" rx="6" fill="black" fill-opacity="0.4"/>
    <circle cx="130" cy="128" r="20" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
    <path d="M123 118L143 128L123 138V118Z" fill="white" fill-opacity="0.4"/>

    <!-- right panel -->
    <rect x="258" y="48" width="92" height="160" rx="4" fill="white" fill-opacity="0.02" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
    <text x="269" y="66" font-family="monospace" font-size="7" fill="white" fill-opacity="0.3" letter-spacing="1">PROPERTIES</text>
    <rect x="269" y="74" width="70" height="1" fill="white" fill-opacity="0.07"/>
    <text x="269" y="88" font-family="monospace" font-size="7" fill="white" fill-opacity="0.25">Position X</text>
    <rect x="269" y="92" width="70" height="6" rx="3" fill="white" fill-opacity="0.06"/>
    <text x="269" y="110" font-family="monospace" font-size="7" fill="white" fill-opacity="0.25">Position Y</text>
    <rect x="269" y="114" width="70" height="6" rx="3" fill="white" fill-opacity="0.06"/>
    <text x="269" y="132" font-family="monospace" font-size="7" fill="white" fill-opacity="0.25">Scale</text>
    <rect x="269" y="136" width="50" height="6" rx="3" fill="white" fill-opacity="0.06"/>
    <rect x="323" y="136" width="16" height="6" rx="3" fill="white" fill-opacity="0.12"/>
    <text x="269" y="154" font-family="monospace" font-size="7" fill="white" fill-opacity="0.25">Opacity</text>
    <rect x="269" y="158" width="70" height="3" rx="1.5" fill="white" fill-opacity="0.06"/>
    <rect x="269" y="158" width="55" height="3" rx="1.5" fill="white" fill-opacity="0.25"/>

    <!-- playback controls -->
    <rect x="10" y="216" width="240" height="28" rx="4" fill="white" fill-opacity="0.02"/>
    <text x="50" y="234" font-family="monospace" font-size="11" fill="white" fill-opacity="0.4" text-anchor="middle">⏮</text>
    <circle cx="130" cy="230" r="10" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
    <path d="M127 225L134 230L127 235V225Z" fill="white" fill-opacity="0.6"/>
    <text x="210" y="234" font-family="monospace" font-size="11" fill="white" fill-opacity="0.4" text-anchor="middle">⏭</text>

    <!-- V1 timeline track -->
    <text x="10" y="262" font-family="monospace" font-size="8" fill="#a78bfa" fill-opacity="0.8">V1</text>
    <rect x="30" y="252" width="320" height="16" rx="4" fill="white" fill-opacity="0.03" stroke="white" stroke-opacity="0.07" stroke-width="1"/>
    <rect x="30" y="252" width="210" height="16" rx="4" fill="#8b5cf6" fill-opacity="0.22" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="244" y="252" width="106" height="16" rx="4" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>

    <!-- A1 timeline track -->
    <text x="10" y="284" font-family="monospace" font-size="8" fill="#34d399" fill-opacity="0.8">A1</text>
    <rect x="30" y="274" width="320" height="12" rx="3" fill="white" fill-opacity="0.02" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
    <!-- waveform bars -->
    <g fill="#34d399" fill-opacity="0.35">
      <rect x="32" y="277" width="1" height="6"/>
      <rect x="35" y="276" width="1" height="8"/>
      <rect x="38" y="278" width="1" height="4"/>
      <rect x="41" y="275" width="1" height="9"/>
      <rect x="44" y="277" width="1" height="5"/>
      <rect x="47" y="276" width="1" height="7"/>
      <rect x="50" y="279" width="1" height="3"/>
      <rect x="53" y="275" width="1" height="9"/>
      <rect x="56" y="277" width="1" height="6"/>
      <rect x="59" y="276" width="1" height="7"/>
      <rect x="62" y="278" width="1" height="4"/>
      <rect x="65" y="275" width="1" height="9"/>
      <rect x="68" y="277" width="1" height="5"/>
      <rect x="71" y="276" width="1" height="8"/>
      <rect x="74" y="279" width="1" height="3"/>
      <rect x="77" y="275" width="1" height="9"/>
      <rect x="80" y="277" width="1" height="6"/>
      <rect x="83" y="276" width="1" height="7"/>
      <rect x="86" y="278" width="1" height="5"/>
      <rect x="89" y="275" width="1" height="9"/>
    </g>

    <!-- Playhead -->
    <rect x="148" y="244" width="1" height="52" fill="white" fill-opacity="0.6"/>
    <polygon points="143,244 153,244 148,250" fill="white" fill-opacity="0.7"/>

    <!-- Speed control section -->
    <text x="10" y="316" font-family="monospace" font-size="7" fill="white" fill-opacity="0.25" letter-spacing="1">SPEED</text>
    <rect x="10" y="320" width="320" height="3" rx="1.5" fill="white" fill-opacity="0.06"/>
    <rect x="10" y="320" width="160" height="3" rx="1.5" fill="white" fill-opacity="0.3"/>
    <text x="340" y="324" font-family="monospace" font-size="9" fill="white" fill-opacity="0.4" text-anchor="end">1×</text>

    <!-- Export button -->
    <rect x="10" y="340" width="100" height="28" rx="6" fill="white"/>
    <text x="60" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#111111" text-anchor="middle">Export .webm</text>
    <rect x="118" y="340" width="80" height="28" rx="6" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
    <text x="158" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.5" text-anchor="middle">Import</text>
  </g>
</svg>
