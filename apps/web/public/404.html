<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>OpenCut</title>
  <script>
    // SPA redirect trick for GitHub Pages
    // Stores the path in sessionStorage and redirects to index
    var l = window.location;
    var segmentCount = 1; // /Opencut = 1 segment
    var path = l.pathname.slice(1).split('/').slice(segmentCount).join('/');
    if (path) {
      sessionStorage.redirect = '/' + path + (l.search || '') + (l.hash || '');
    }
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=1'
    );
  </script>
</head>
<body>Redirecting…</body>
</html>
